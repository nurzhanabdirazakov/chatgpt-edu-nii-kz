name: Refresh public report safely
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      valid: ${{ steps.sync.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Visually read and validate public Power BI
        id: sync
        continue-on-error: true
        run: node scripts/sync-powerbi.mjs
      - name: Preserve last good data if the report cannot be verified
        if: steps.sync.outcome != 'success'
        run: |
          echo '::warning::Power BI extraction could not be verified. Existing dashboard data was NOT replaced.'
          echo '## Refresh not published — last good data preserved' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-reading-evidence
          path: sync-evidence/
          retention-days: 7
      - name: Save verified snapshot
        if: steps.sync.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/power-bi.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified public Power BI metrics'
            git push
          fi
      - name: Build dashboard
        if: steps.sync.outcome == 'success'
        run: npx next build
      - uses: actions/upload-pages-artifact@v3
        if: steps.sync.outcome == 'success'
        with:
          path: ./out
  deploy:
    needs: refresh
    if: needs.refresh.outputs.valid == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish verified data
        id: deployment
        uses: actions/deploy-pages@v4
